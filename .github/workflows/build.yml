
name: Build DXCFlix OPT APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and Extract Project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"

          else
            ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -n "$ZIP" ]; then
              mkdir -p extracted
              unzip -o "$ZIP" -d extracted
            fi

            SETTINGS=$(find . -type f -name "settings.gradle" \
              -not -path "./.git/*" \
              -not -path "./.github/*" | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: Android project not found!"
              exit 1
            fi

            DIR=$(dirname "$SETTINGS")
            echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify Android Project
        run: |
          test -f "$PROJECT_DIR/app/build.gradle"
          echo "Project verified successfully"

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload DXCFlix OPT APK
        uses: actions/upload-artifact@v4
        with:
          name: DXCFlixOPT-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
